# Problem/Agitation Section
problem:
  headline: The Innovation Paradox
  subheadline: You know innovation is critical. Your team has great ideas. But somehow, nothing systematic actually happens.
  pain_points:
    - icon: 💭
      text: Great ideas mentioned in meetings... then forgotten by next week
    - icon: 📧
      text: Innovation suggestions buried in email threads nobody searches
    - icon: 📊
      text: Spreadsheets that nobody maintains, updates, or actually reviews
    - icon: 🤷
      text: No clear process for evaluating which ideas deserve resources
    - icon: 💸
      text: Time and money wasted on ideas that don't align with strategy
    - icon: 👥
      text: Employees stop contributing because "nothing ever happens anyway"
  stats:
    - value: "R450,000+"
      label: Average annual loss from missed innovation opportunities
      source: SA SMB Innovation Study, 2024
    - value: "58%"
      label: of employee ideas never get formally evaluated
      source: Innovation Benchmark Report
    - value: "3.2 hours"
      label: wasted per week managing spreadsheets and email chaos
      source: SMB Productivity Research
  transition: There's a Better Way.

# Solution Section
solution:
  headline: Innovation Management That Actually Gets Used
  subheadline: IdeaNexus gives you a complete system for managing innovation—from the first spark to implemented reality. No consultants needed. No complex training. Just straightforward tools your whole team will actually use.
  process:
    - step: "1"
      icon: 💡
      title: CAPTURE
      description: Simple form anyone can use. Mobile-friendly. Captured in seconds.
    - step: "2"
      icon: ⚖️
      title: EVALUATE
      description: Objective scoring based on clear criteria. Fair decisions. Transparent.
    - step: "3"
      icon: ✅
      title: IMPLEMENT
      description: Complete tracking from approval to reality. Full visibility. Accountable.
  benefits:
    - icon: 🎯
      title: Never Lose Another Great Idea
      description: Every suggestion is captured in a centralized, searchable repository with full history. Even if the original champion leaves your company, the idea survives and can be revived when timing is right.
      features:
        - Simple submission forms with customizable fields
        - Full-text search across all ideas and comments
        - Complete audit trail and version history
        - Tag and categorize for easy filtering
        - Anonymous submission option for sensitive topics
    - icon: ⚖️
      title: Make Fair, Data-Driven Decisions
      description: Evaluate every idea against consistent criteria—impact, feasibility, resources, and strategic fit. No more HIPPO (Highest Paid Person's Opinion) decision-making or office politics determining which ideas move forward.
      features:
        - Customizable scoring framework (1-5 or 1-10 scales)
        - Multi-evaluator input with weighted criteria
        - Automatic score aggregation and ranking
        - Comment threads for collaborative refinement
        - Approval workflows with clear decision authority
    - icon: 📊
      title: Track Ideas From Spark to Implementation
      description: See exactly where every idea sits in your innovation pipeline. Identify bottlenecks instantly. Keep stakeholders informed automatically. Celebrate wins publicly to build momentum.
      features:
        - Visual kanban board with customizable stages
        - Drag-and-drop status updates
        - Automated notifications at each stage
        - Implementation progress tracking (0-100%)
        - Complete timeline view of idea journey
    - icon: 🚀
      title: Get Your Team Actually Contributing
      description: When people see their ideas get evaluated fairly and tracked transparently, they keep contributing. Build an innovation culture where everyone feels heard—not just a process that sits unused.
      features:
        - Contributor dashboard showing all submissions
        - Public recognition for implemented ideas
        - Feedback loops at every stage (no black holes)
        - Gamification with idea counts and impact metrics
        - Team leaderboards and contribution tracking

